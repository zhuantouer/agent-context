name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Shell syntax
        run: bash -n scripts/install-local.sh scripts/bump-version.sh

      - name: Validate plugin structure
        run: node scripts/validate-template.mjs

      - name: Check version lockstep
        run: ./scripts/bump-version.sh --check

      - name: Run hook and packaging tests
        run: python3 scripts/test-hooks.py
